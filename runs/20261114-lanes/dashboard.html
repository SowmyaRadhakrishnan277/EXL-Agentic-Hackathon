}

:root[data-theme="dark"] {
  --bg: #0f151a; --surface: #161e25; --sunk: #1d272f; --line: #2a3640;
  --fg: #e3e9ed; --muted: #95a3ad; --accent: #6fb0dc;
  --ok: #5cc98d; --ok-bg: #173527; --fix: #6fb0dc; --fix-bg: #162c3c;

* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--body);

.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 28px }

.draft { font-size: 12px; color: var(--warn) }

.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted) }

ode": "/* ---------------------------------------------------------------------------\n   J05  Claims staging                         schedule: nightly 01:30\n   Source : dbo.claims\n   Target : stg.claims\n   Note   : rejected claims are excluded. Status is passed through unchanged.\n--------------------------------------------------------------------------- */\nDECLARE @asof DATE = '2025-12-31';\n\nDROP TABLE IF EXISTS stg.claims;\n\nSELECT\n    c.claim_id,\n    c.policy_id,\n    c.loss_date,\n    c.reported_date,\n    c.claim_type,\n    c.status,\n    c.reserve_amount,\n    DATEDIFF(DAY, c.reported_date, @asof) AS claim_age_days\nINTO stg.claims\nFROM dbo.claims c\nWHERE c.status <> 'REJECTED';\n", "pyspark_path": "migrated/J05_stg_claims/job.py", "pyspark": "from pyspark.sql import functions as F\nfrom pyspark.sql.types import *\n\ndef run(spark, tables):\n    claims = tables['dbo.claims']\n    asof_date = '2025-12-31'\n    \n    stg_claims = claims.filter(F.upper(F.rtrim(claims['status'])) != 'REJECTED')\\\n        .select(\n            claims['claim_id'],\n            claims['policy_id'],\n            claims['loss_date'],\n            claims['reported_date'],\n            claims['claim_type'],\n            claims['status'],\n            claims['reserve_amount'],\n            F.datediff(F.lit(asof_date), claims['reported_date']).alias('claim_age_days')\n        )\n    \n    return {'stg.claims': stg_claims}", "tries": [{"attempt": 1, "passed": false, "why": "3 rows differ from legacy output", "seconds": 47.41}, {"attempt": 2, "passed": false, "why": "no usable code: J05_stg_claims: no valid translation after 3 tries (job_py is the same code as an earlier attempt that already failed. Change the logic that causes the reported differences)", "seconds": 112.3}, {"attempt": 3, "passed": true, "why": "passed (legacy output)", "seconds": 92.36}], "rows": [{"table": "silver.claims", "legacy": 6415, "migrated": 6415, "mismatched": 0}], "risks": ["String Collation/Case S pt 3: change: Modified the filter condition to use `upper(rtrim(col('status'))) != 'REJECTED'` to match the legacy behavior of ignoring trailing spaces and being case-insensitive.", "attempt 3: Reproduced case-insensitive and space-ignoring string comparison for 'status'.", "attempt 3: Reproduced the calculation of 'claim_age_days' using the hardcoded as-of date.", "attempt 3: Ensured that 'status' is not modified in the output, matching the legacy contract.", "attempt 3: Verified that 'claim_age_days' is an integer and non-negative.", "attempt 3: Confirmed that 'reserve_amount' is of type decimal(18,2) and non-nullable.", "unit tests: written to test_job.py"]}, {"id": "J06_stg_policy_earned_premium", "llm": "openrouter/particle-ai/particle-1:free", "status": "repaired", "language": "tsql", "wave": 2, "layer": "silver", "attempts": 4, "seconds": 419.1, "targets": ["silver.policy_earned_premium"], "depends_on": ["J02_stg_policies"], "summary": "Calculates days in force and pro-rated earned premium per policy for calendar years 2021 through 2025 based on policy active date overlaps.", "legacy_path": "legacy/tsql/J06_stg_policy_earned_premium.sql", "legacy_code": "/* ---------------------------------------------------------------------------\n   J06  Earned premium by policy and year      schedule: nightly 02:00\n   Source : stg.policies\n   Target : stg.policy_earned_premium\n   Rule   : earned = annual premium x days in force in the year / 365\n--------------------------------------------------------------------------- */\nDROP TABLE IF EXISTS stg.policy_earned_premium;\n\nSELECT\n    p.policy_id,\n    p.product_code,\n    y.yr                                               AS policy_year,\n    d.days_in_force,\n    ROUND(p.annual_premium * d.days_in_force / 365.0, 2) AS earned_premium\nINTO stg.policy_earned_premium\nFROM stg.policies p\nCROSS JOIN (VALUES (2021), (2022), (2023), (2024), (2025)) AS y(yr)\nCROSS APPLY (\n    SELECT DATEDIFF(DAY,\n               IIF(p.start_date > DATEFROMPARTS(y.yr, 1, 1),  p.start_date, DATEFROMPARTS(y.yr, 1, 1)),\n               IIF(p.end_date   < DATEFROMPARTS(y.yr, 12, 31), p.end_date,  DATEFROMPARTS(y.yr, 12, 31))\n           ) + 1 AS days_in_force\n) d\nWHERE p.start_date <= DATEFROMPARTS(y.yr, 12, 31)\n  AND p.end_date   >= DATEFROMPARTS(y.yr, 1, 1);\n", "pyspark_path": "migrated/J06_stg_policy_earned_premium/job.py", "pyspark": "from decimal import Decimal\n\nfrom pyspark.sql import functions as F\nfrom pyspark.sql.types import DecimalType, IntegerType, StructField, StructType\n\nYEARS = [2021, 2022, 2023, 2024, 2025]\n\n\ndef run(spark, tables):\n    policies = tables['stg.policies']\n\n    # Inline VALUES (2021)..(2025) AS y(yr) -- hardcoded year range kept as in legacy\n    years = spark.createDataFrame(\n        [(y,) for y in YEARS],\n        StructType([StructField('yr', IntegerType(), False)]),\n    )\n\n    p = policies.select(\n        F.col('policy_id'),\n        F.col('product_code'),\n        F.col('annual_premium'),\n        F.to_date(F.col('start_date')).alias('start_date'),\n        F.to_date(F.col('end_date')).alias('end_date'),\n    )\n\n    # CROSS JOIN y(yr)\n    j = p.crossJoin(years)\n\n    jan1 = F.make_date(F.col('yr'), F.lit(1), F.lit(1))\n    dec31 = F.make_date(F.col('yr'), F.lit(12), F.lit(31))\n\n    # IIF(p.start_date > Jan1, p.start_date, Jan1)  -- NULL condition -> ELSE branch\n    lo = F.when(F.col('start_date') > jan1, F.col('start_date')).otherwise(jan1)\n    # IIF(p.end_date < Dec31, p.end_date, Dec31)    -- NULL condition -> ELSE branch\n    hi = F.when(F.col('end_date') < dec31, F.col('end_date')).otherwise(dec31)\n\n    # DATEDIFF(DAY, lo, hi) + 1  -> inclusive days in force\n    j = j.withColumn(\n        'days_in_force',\n        (F.datediff(hi, lo) + F.lit(1)).cast(IntegerType()),\n    )\n\n    # WHERE p.start_date <= Dec31 AND p.end_date >= Jan1  (NULL -> unknown -> dropped)\n    j = j.filter((F.col('start_date') <= dec31) & (F.col('end_date') >= to a legacy table and CSV export.", "legacy_path": "legacy/sas/J07_stg_claim_totals.sas", "legacy_code": "/* ---------------------------------------------------------------------------\n   J07  Paid totals per claim                  schedule: nightly 02:10\n   Source : legacy.stg_claim_payments (J04), stg_claims.csv (J05 export)\n   Target : legacy.claim_totals  (+ golden CSV)\n--------------------------------------------------------------------------- */\n%let root = /home/&sysuserid/exl;\nlibname legacy \"&root/lib\";\noptions missing=' ';\n\ndata work.stg_claims;\n    infile \"&root/input/stg_claims.csv\" dsd firstobs=2 truncover;\n    length claim_id $12 policy_id $12 claim_type $20 status $20;\n    informat loss_date reported_date yymmdd10.;\n    format   loss_date reported_date yymmdd10.;\n    input claim_id $ policy_id $ loss_date reported_date claim_type $ status $\n          reserve_amount claim_age_days;\nrun;\n\nproc sql;\n    create table work.pay_by_claim as\n    select claim_id,\n           sum(case when payment_type = 'INDEMNITY' then amount end) as indemnity_paid,\n           sum(case when payment_type = 'EXPENSE'   then amount end) as expense_paid,\n           count(*)                                                  as payment_count\n    from legacy.stg_claim_payments\n    group by claim_id;\n\n    create table work.joined as\n    select c.claim_id, c.policy_id, c.claim_type, c.loss_date,\n           p.indemnity_paid, p.expense_paid,\n           coalesce(p.payment_count, 0) as payment_count\n    from work.stg_claims c\n    left join work.pay_by_claim p\n      on c.claim_id = p.claim_id;\nquit;\n\ndata legacy.claim_totals;\n    set work.joined;\n    length small_claim_flag $1;\n    total_paid = round(indemnity_paid + expense_paid, 0.01);\n    if total_paid < 500 then small_claim_flag = 'Y';\n    else small_claim_flag = 'N';\nrun;\n\nproc export data=legacy.claim_totals\n    outfile=\"&root/golden/claim_totals.csv\" dbms=csv replace;\nrun;\n", "pyspa ate percentages. It produces the rpt.premium_collections table used by the Credit Control and Arrears Review teams.", "legacy_path": "legacy/tsql/J09_rpt_premium_collections.sql", "legacy_code": "/* ---------------------------------------------------------------------------\n   J09  Premium due vs collected by month      schedule: monthly, BD1 06:15\n   Source : stg.premiums\n   Target : rpt.premium_collections\n   Used by: Credit control / arrears review\n--------------------------------------------------------------------------- */\nDROP TABLE IF EXISTS rpt.premium_collections;\n\nSELECT\n    DATEFROMPARTS(YEAR(pm.due_date), MONTH(pm.due_date), 1)              AS due_month,\n    COUNT(*)                                                             AS instalments_due,\n    SUM(pm.amount)                                                       AS amount_due,\n    SUM(CASE WHEN pm.paid_flag = 'Y' THEN pm.amount ELSE 0 END)          AS amount_collected,\n    SUM(pm.amount)\n      - SUM(CASE WHEN pm.paid_flag = 'Y' THEN pm.amount ELSE 0 END)      AS arrears,\n    CAST(100.0 * SUM(CASE WHEN pm.paid_flag = 'Y' THEN pm.amount ELSE 0 END)\n         / NULLIF(SUM(pm.amount), 0) AS DECIMAL(9, 2))                   AS collection_rate_pct\nINTO rpt.premium_collections\nFROM stg.premiums pm\nGROUP BY DATEFROMPARTS(YEAR(pm.due_date), MONTH(pm.due_date), 1);\n", "pyspark_path": "migrated/J09_rpt_premium_collections/job.py", "pyspark": "from pyspark.sql import functions as F\nfrom pyspark.sql.types import DecimalType\n\ndef run(spark, tables):\n    premiums = tables['stg.premiums']\n    \n    # Calculate due_month\n    premiums = premiums.withColumn('due_month', F.when(F.col('due_date').isNull(), F.lit(None)).otherwise(F.date_trunc('month', F.col('due_date')).cast('date')))\n    \n    # Aggregate data\n    result = premiums.groupBy('due_month').agg(\n        F.count(F.col('*')).alias('instalments_due'),\n        F.sum(F.col('amount')).cast(DecimalType(38, 3)).alias('amount_due'),\n        F.sum(F.when(F.col('paid_flag') == 'Y', F.col('amount')).otherwise(0)).cast(DecimalType(38, 3)).alias('amount_collected'),\n        (F.sum(F.col('amount')) - F.sum(F.when(F.col('paid_flag') == 'Y', F.col('amount')).otherwise(0))).cast(DecimalType(38, 3)).alias('arrears'),\n        (F.lit(100.0) * F.sum(F.when(F.col('paid_flag') == 'Y', F.col('amount')).otherwise(0)) / F.when(F.col('amount_due') == 0, F.lit(None)).otherwise(F.col('amount_due'))).cast(DecimalType(9, 2)).alias('collection_rate_pct')\n    )\n    \n    # Ensure all columns are not null\n    result = result.withColumn('instalments_due', F.coalesce(F.col('instalments_due'), F.lit(0)))\n    result = result.withColumn('amount_due', F.coalesce(F.col('amount_due'), F.lit(0.0)).cast(DecimalType(38, 3)))\n    result = result.withColumn('amount_collected', F.coalesce(F.col('amount_collected'), F.lit(0.0)).cast(DecimalType(38, 3)))\n    result = result.withColumn('arrears', F.coalesce(F.col('arrears'), F.lit(0.0)).cast(DecimalType(38, 3)))\n    result = result.withColumn('collection_rate_pct', F.coalesce(F.col('collection_rate_pct'), F.lit(0.0)).cast(DecimalType(9, 2)))\n    \n    return {'gold.premium_collections': result}", "tries": [{"attempt": 1, "passed": false, "why": "due_month: type timestamp, contract says date", "seconds": 98.32}, {"attempt": 2, "passed": false, "why": "due_month: type timestamp, contract says date", "seconds": 89.54}, {"attempt": 3, "passed": true, "why": "passed (legacy output)", "seconds": 221.26}], "rows": [{"table": "gold.premium_collections", "legacy": 60, "migrated": 60, "mismatched": 0}], "risks": ["String Comparison / Collation: T-SQL comparison pm.paid_flag = 'Y' is case-insensitive by default, whereas PySpark is case-sensitive and will exclude 'y' unless upper() or lower() is explicitly applied.", "Date Functions & NULL Grouping: DATEFROMPARTS(YEAR(pm.due_date), MONTH(pm.due_date), 1) returns NULL if due_date is NULL. Translating to PySpark date_trunc('month', col('due_da in_force earned_premium;\nrun;\n\nproc sql;\n    create table work.earned as\n    select product_code, policy_year, sum(earned_premium) as earned_premium\n    from work.earned_policy\n    group by product_code, policy_year;\n\n    create table work.incurred as\n    select p.product_code,\n           year(t.loss_date)     as loss_year,\n           sum(t.indemnity_paid) as incurred,\n           count(*)              as claim_count\n    from legacy.claim_totals t\n    inner join work.policies p\n      on t.policy_id = p.policy_id\n    group by p.product_code, calculated loss_year;\n\n    create table work.lr as\n    select coalesce(e.product_code, i.product_code) as product_code length=10,\n           coalesce(e.policy_year, i.loss_year)     as year,\n           e.earned_premium,\n           i.incurred,\n           i.claim_count\n    from work.earned e\n    full join work.incurred i\n      on e.product_code = i.product_code\n     and e.policy_year  = i.loss_year;\nquit;\n\ndata legacy.rpt_loss_ratio;\n    set work.lr;\n    if earned_premium > 0 then loss_ratio = round(incurred / earned_premium, 0.0001);\nrun;\n\nproc export data=legacy.rpt_loss_ratio\n    outfile=\"&root/golden/rpt_loss_ratio.csv\" dbms=csv replace;\nrun;\n", "pyspark_path": "migrated/J10_rpt_loss_ratio/job.py", "pyspark": "from pyspark.sql import functions as F\nfrom pyspark.sql.types import DecimalType\n\ndef run(spark, tables):\n    claim_totals = tables['legacy.claim_totals']\n    policies = tables['stg.policies']\n    earned_policy = tables['stg.policy_earned_premium']\n\n    # Create earned DataFrame\n    earned = earned_policy.groupBy('product_code', 'policy_year')\\\n        .agg(F.sum('earned_premium').alias('earned_premium'))\n\n    # Create incurred DataFrame\n    incurred = claim_totals.join(policies, 'policy_id')\\\n        .groupBy('product_code', F.year('loss_date').alias('loss_year'))\\\n        .agg(F.sum('indemnity_paid').alias('incurred'), F.count('*').alias('claim_count'))\n\n    #   const fmtT = s => s >= 60 ? Math.round(s / 60) + " min" : s > 0 ? Math.round(s) + " s" : "-";
  const short = id => id.split("_")[0];
  const jobs = D.jobs, n = jobs.length;
  const by = s => jobs.filter(j => j.status === s).length;
  const passed = jobs.filter(j => PASS.has(j.status)).length;

  const meta = document.getElementById("meta");
  [["Run", D.run], ["Translation model", D.meta.llm], ["Engine", D.meta.engine], ["Generated", D.generated]]
    .forEach(([k, v]) => meta.append(el("span", {}, k + " ", el("b", { text: v }))));

  const k = document.getElementById("kpis");
  const big = el("div", { class: "kpi" },
    el("span", { class: "l", text: "Jobs reconciled with legacy output" }),
    el("span", { class: "n" }, String(passed), el("small", { text: " / " + n + "  (" + Math.round(100 * passed / n) + "%)" })));
  const bar = el("div", { class: "bar", role: "img", "aria-label": "Status of all jobs" });
  ["matched", "repaired", "validated", "needs_review", "blocked", "pending"].forEach(s => {
    const c = by(s); if (c) bar.append(el("span", { style: `width:${100 * c / n}%;background:${COLOR[s]}`, title: LABEL[s] + ": " + c })); });
  big.append(bar); k.append(big);
  [["matched", "Matched on the first try"], ["repaired", "Fixed by the repair loop"],
   ["needs_review", "Out of attempts: human review"], ["blocked", "Waiting on an upstream job"]]
    .concat(by("pending") ? [["pending", "Not run yet"]] : [])
    .forEach(([s, l]) => k.append(el("div", { class: "kpi" },
      el("span", { class: "l", text: l }), el("span", { class: "n", text: String(by(s)), style: s === "pending" ? "" : `color:${COLOR[s]}` }))));

  const lg = document.getElementById("legend");
  ["matched", "repaired", "needs_review", "blocked"].concat(by("pending") ? ["pending"] : []).forEach(s =>
    lg.append(el("span", {}, el("i", { style: "background:" + COLOR[s] }), LABEL[s])));
  const lanes = document.getElementById("lanes");
  [...new Set(jobs.map(j => j.wave))].sort().forEach(w => {
    const lane = el("div", { class: "lane" }, el("h3", { text: "Wave " + w }));
    jobs.filter(j => j.wave === w).forEach(j => lane.append(el("a", { class: "chip", href: "#" + j.id },
      el("span", { class: "dot", style: "background:" + COLOR[j.status] }),
      el("span", {}, el("span", { text: j.id }), el("br"), el("span", { class: "dep",
        text: j.depends_on.length ? "after " + j.depends_on.map(short).join(", ") : "reads bronze only" })),
      el("span", { class: "lang", text: j.language }))));
    lanes.append(lane);
  });

  const rows = document.getElementById("rows");
  jobs.forEach(j => {
    const tries = el("span", { class: "tries", "aria-label": j.tries.length + " attempts" });
    j.tries.forEach(t => tries.append(el("i", { class: t.passed ? "t-ok" : "t-bad", title: "Attempt " + t.attempt + ": " + t.why })));
    if (!j.tries.length) tries.append(el("span", { class: "lang", text: "not run" }));
    const r = j.rows[0] || {}, ran = j.rows.length && j.status !== "blocked";
    const diff = ran ? (r.mismatched || 0) : null;
    rows.append(el("tr", {},
      el("td", {}, el("a", { href: "#" + j.id, text: j.id })),
      el("td", {}, el("span", { class: "lang", text: j.language })),
      el("td", { text: j.targets.join(", ") }),
      el("td", {}, pill(j.status)), el("td", {}, tries),
      el("td", { class: "num", text: ran && r.legacy ? r.legacy.toLocaleString() : "-" }),
      el("td", { class: "num", text: ran && r.migrated ? r.migrated.toLocaleString() : "-" }),
      el("td", { class: "num" + (diff ? " diffwarn" : ""), text: diff == null ? "-" : diff.toLocaleString() }),
      el("td", { class: "num", text: fmtT(j.seconds) })));
  });

  const box = document.getElementById("jobs");
  const list = (title, items) => el("div", {}, el("span", { class: "eyebrow", text: title }),
    items.length ? (() => { const u = el("ul", { class: "notes" }); items.forEach(i => u.append(el("li", { text: i }))); return u; })()
                 : el("p", { text: "None." }));
  jobs.forEach(j => {
    const d = el("details", { class: "job", id: j.id });
    d.append(el("summary", {}, el("span", { class: "id", text: j.id }), pill(j.status),
      el("span", { class: "lang", text: j.language + " \u2192 " + j.targets.join(", ") }),
      j.llm ? el("span", { class: "lang", text: "written by " + j.llm.split("/").pop() }) : null,
      el("span", { class: "arrow", text: "Show" })));
    const body = el("div", { class: "dossier" });
    if (j.summary) body.append(el("p", { text: j.summary }));
    const ok = PASS.has(j.status);
    const conv = el("div", { class: "codebox" },
      el("div", { class: "hd" }, el("span", { class: "eyebrow", text: "Converted PySpark" }), el("span", { class: "path", text: j.pyspark_path || "not generated" })),
      !ok && j.pyspark ? el("span", { class: "draft", text: "Last draft: this code did not reconcile and needs review." }) : null,
      el("pre", {}, el("code", { text: j.pyspark || (j.status === "blocked" ? "Not generated: an upstream job did not pass." : j.status === "pending" ? "Not run yet." : "No code produced.") })));
    const leg = el("div", { class: "codebox" },
      el("div", { class: "hd" }, el("span", { class: "eyebrow", text: "Legacy " + j.language.toUpperCase() }), el("span", { class: "path", text: j.legacy_path })),
      el("pre", {}, el("code", { text: j.legacy_code })));
    body.append(el("div", { class: "code2" }, conv, leg));
    const att = el("div", {}, el("span", { class: "eyebrow", text: "Attempts" }));
    if (j.tries.length) { const o = el("ol", { class: "att" });
      j.tries.forEach(t => o.append(el("li", {}, el("span", { class: "n", text: "Attempt " + t.attempt }),
        el("code", { text: t.why, style: "color:" + (t.passed ? "var(--ok)" : "var(--fg)") }), el("span", { class: "lang", text: fmtT(t.seconds) }))));
      att.append(o);
    } else att.append(el("p", { text: j.status === "pending" ? "Not run yet." : "Not run: " + (j.depends_on.length ? "upstream " + j.depends_on.map(short).join(", ") + " did not pass." : "no attempts recorded.") }));
    body.append(att);
    body.append(el("div", { class: "cols3" }, list("Discovery: legacy risks", j.risks),
      list("Design: guardrails applied", j.guardrails), list("Translation: agent assumptions", j.translation)));
    d.append(body);
    d.addEventListener("toggle", () => d.querySelector(".arrow").textContent = d.open ? "Hide" : "Show");
    box.append(d);
  });
  const openHash = () => { const t = location.hash && document.getElementById(location.hash.slice(1));
    if (t && t.tagName === "DETAILS") { t.open = true; t.scrollIntoView({ block: "start" }); } };
  window.addEventListener("hashchange", openHash); openHash();
  document.getElementById("foot").textContent = "Each converted job is checked against its data contract and diffed row by row "
    + "against the legacy output (legacy/golden). Code lives in migrated/<job>/job.py; earlier attempts in migrated/<job>/attempts/.";
})();
</script>
